name: CI/CD - Docker, GHCR, Docker Hub y Render

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  LOCAL_IMAGE: dds-devops-demo:test
  DOCKERHUB_REPO: dds-devops-demo

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Definir nombres y tags de imagen
        id: image
        shell: bash
        run: |
          echo "ghcr=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "dockerhub=${{ vars.DOCKERHUB_USERNAME }}/${DOCKERHUB_REPO}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # La imagen se construye y valida UNA sola vez
      - name: Construir imagen Docker
        run: docker build -t "$LOCAL_IMAGE" .

      - name: Verificar funcionamiento
        run: |
          docker run -d --name web-test \
            -p 127.0.0.1:8080:80 \
            "$LOCAL_IMAGE"
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/ | grep -q "Hola DevOps"; then
              echo "Prueba exitosa"
              docker rm -f web-test
              exit 0
            fi
            sleep 1
          done
          docker logs web-test
          exit 1

      - name: Autenticarse en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Autenticarse en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Etiquetar imagen para ambos registros
        run: |
          for repo in ${{ steps.image.outputs.ghcr }} ${{ steps.image.outputs.dockerhub }}; do
            docker tag "$LOCAL_IMAGE" "$repo:${{ steps.image.outputs.sha }}"
            docker tag "$LOCAL_IMAGE" "$repo:latest"
          done
          docker images

      - name: Publicar imagen en GHCR
        run: |
          docker push ${{ steps.image.outputs.ghcr }}:${{ steps.image.outputs.sha }}
          docker push ${{ steps.image.outputs.ghcr }}:latest

      - name: Publicar imagen en Docker Hub
        run: |
          docker push ${{ steps.image.outputs.dockerhub }}:${{ steps.image.outputs.sha }}
          docker push ${{ steps.image.outputs.dockerhub }}:latest

      # Render despliega la imagen del commit recien publicada en Docker Hub
      - name: Desplegar en Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Falta el secret RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi
          img="docker.io/${{ steps.image.outputs.dockerhub }}:${{ steps.image.outputs.sha }}"
          curl -fsS -X POST -G "$RENDER_DEPLOY_HOOK_URL" \
            --data-urlencode "imgURL=$img"
          echo
          echo "Deploy disparado en Render con $img"

      - name: Resumen
        run: |
          {
            echo "### Imagenes publicadas"
            echo "- \`${{ steps.image.outputs.ghcr }}:${{ steps.image.outputs.sha }}\`"
            echo "- \`${{ steps.image.outputs.ghcr }}:latest\`"
            echo "- \`${{ steps.image.outputs.dockerhub }}:${{ steps.image.outputs.sha }}\`"
            echo "- \`${{ steps.image.outputs.dockerhub }}:latest\`"
            echo "### Deploy"
            echo "Render desplegando \`${{ steps.image.outputs.dockerhub }}:${{ steps.image.outputs.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
